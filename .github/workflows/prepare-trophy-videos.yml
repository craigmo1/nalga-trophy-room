name: Prepare controllable trophy videos
on:
  workflow_dispatch:
  push:
    paths:
      - 'images/*.webp'
      - '.github/workflows/prepare-trophy-videos.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow imageio-ffmpeg
      - name: Convert animated WebP to pausable, seekable MP4
        run: python scripts/convert_trophies.py
      - name: Commit converted videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/
          if ! git diff --cached --quiet; then
            git commit -m "Add slow, pausable trophy rotation videos"
            git push
          fi
